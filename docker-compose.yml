services:
  postgres:
    image: pgvector/pgvector:pg18 # PostgreSQL 18 with the pgvector extension
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432" # local machine only
    volumes:
      - postgres_data:/var/lib/postgresql # PG 18+ expects the parent of the versioned data dir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173" # dev server: local machine only
    environment:
      DATA_DIR: /data
      # the reading room proxies /api to `pipeline ui` running on the host (see pipeline/README.md)
      API_URL: ${API_URL:-http://host.docker.internal:8001}
      # bind mounts don't reliably emit fs events (Docker Desktop / VMs)
      USE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the image's installed deps
      # only the dataset files, read-only; fail fast if one is missing
      - type: bind
        source: ./histories.jsonl
        target: /data/histories.jsonl
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./questions.jsonl
        target: /data/questions.jsonl
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./gold.jsonl
        target: /data/gold.jsonl
        read_only: true
        bind: { create_host_path: false }

volumes:
  postgres_data:
