services:
  postgres:
    image: pgvector/pgvector:pg18 # PostgreSQL 18 with the pgvector extension
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432" # local machine only
    volumes:
      - postgres_data:/var/lib/postgresql # PG 18+ expects the parent of the versioned data dir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173" # dev server: local machine only
    environment:
      DATA_DIR: /data
      # bind mounts don't reliably emit fs events (Docker Desktop / VMs)
      USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the image's installed deps
      # only the dataset files, read-only; fail fast if one is missing
      - type: bind
        source: ./histories.jsonl
        target: /data/histories.jsonl
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./questions.jsonl
        target: /data/questions.jsonl
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./gold.jsonl
        target: /data/gold.jsonl
        read_only: true
        bind: { create_host_path: false }

  memory-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PIPELINE_API_PORT:-8000}:8000"
    # Point REACTOR_ENV_FILE at the handout credentials, for example:
    # export REACTOR_ENV_FILE=../.env
    env_file:
      - ${REACTOR_ENV_FILE:-.env}
    environment:
      REACTOR_TIMEOUT: ${REACTOR_TIMEOUT:-300}
      REACTOR_MAX_CHARS: ${REACTOR_MAX_CHARS:-16000}
    command:
      - --split
      - ${PIPELINE_SPLIT:-dev}
      - --data
      - /data
      - --evidence
      - /evidence/evidence.jsonl
      - --state
      - /state/conversations.jsonl
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      # Dataset and evidence are immutable inputs. Generate evidence before starting the API.
      - type: bind
        source: ${PIPELINE_DATA_DIR:-./dev}
        target: /data
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${PIPELINE_EVIDENCE_FILE:-./pipeline/runs/dev/evidence.jsonl}
        target: /evidence/evidence.jsonl
        read_only: true
        bind: { create_host_path: false }
      # The only writable application data: resumable conversation handles and answer records.
      - pipeline_service_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  pipeline_service_state:
